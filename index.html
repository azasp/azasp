<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8a200">
<title>Kid Tracker</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#222;--mut:#777;--ac:#e8a200;--bd:#e3e0d8;--red:#c0392b;--grn:#2e8b57}
@media (prefers-color-scheme:dark){:root{--bg:#17171a;--card:#232328;--tx:#eee;--mut:#9a9aa3;--bd:#34343b;--red:#e86a5a;--grn:#5fcf92}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;max-width:560px;margin:auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
h1{font-size:20px;margin:4px 0 2px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 6px}
nav button{flex:none;padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;font-size:15px}
nav button.on{background:var(--ac);color:#000;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px}
.big{font-size:30px;font-weight:700}
.row{display:flex;gap:6px;margin-top:6px}
input,select{flex:1;min-width:0;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.add{flex:none;background:var(--ac);color:#000;border:0;border-radius:8px;padding:10px 14px;font-weight:600;font-size:15px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}.sub{color:var(--mut);font-size:13px}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px}
.pos{color:var(--grn)}.neg{color:var(--red)}.fever{color:var(--red);font-weight:700}
#st,#who{color:var(--mut);font-size:13px;margin-top:6px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px;padding:0}
</style></head><body>
<h1>⭐ Kid Tracker</h1>
<div id="who"></div>
<div id="app"></div>
<div id="st"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Paste your Supabase values here (Project Settings > API):
const SUPABASE_URL="PASTE_PROJECT_URL";
const SUPABASE_KEY="PASTE_ANON_PUBLIC_KEY";

const TABS={over:{n:"📊 Overview"},
 money:{n:"💰 Money",num:"Amount ₹",txt:"Note (allowance, toy…)",sign:["Add","Spend"]},
 stars:{n:"⭐ Stars",num:"Stars",txt:"Reason",sign:["Earn","Lose"]},
 shop:{n:"🛍 Shopping",num:"Price ₹",txt:"Item"},
 classes:{n:"📚 Classes",txt:"Class & activity / homework"},
 health:{n:"🌡 Health",num:"Temp °F",txt:"Symptoms / medicine / note"},
 people:{n:"👥 People"}};
const ROLES={parent:"Parent",teacher:"Teacher / caregiver",child:"Child",pending:"No access"};
const ALLOW={admin:["over","money","stars","shop","classes","health","people"],parent:["over","money","stars","shop","classes","health"],teacher:["classes","health"],child:["money","stars"],pending:[]};
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let sb,me,prof,kids=[],items=[],profs=[],tab="",kid=null,busy=false;
const role=()=>prof?prof.role:"pending";
const nm=id=>(profs.find(p=>p.id===id)||{}).name||"";
const msg=t=>{$("st").textContent=t||""};

async function init(){
 if(SUPABASE_URL.startsWith("PASTE")){$("app").append(el("div","card","Add your Supabase URL and key at the top of index.html."));return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_IN"||ev==="SIGNED_OUT")start()});
 start();
}
async function start(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){me=null;login();return}
 if(me&&me.id===session.user.id&&prof)return;
 me=session.user;await load();draw();
}
async function load(){
 const[k,e,p]=await Promise.all([sb.from("kids").select("*").order("created_at"),sb.from("entries").select("*").order("created_at",{ascending:false}),sb.from("profiles").select("*")]);
 if(k.error||e.error||p.error)msg("Could not load data: "+((k.error||e.error||p.error).message));
 kids=k.data||[];items=e.data||[];profs=p.data||[];prof=profs.find(x=>x.id===me.id)||null;
 if(prof&&prof.role==="admin"&&!kids.length){await sb.from("kids").insert({name:"My child"});const r=await sb.from("kids").select("*");kids=r.data||[]}
}
function login(){
 $("who").textContent="";const A=$("app");A.textContent="";
 const c=el("div","card"),em=el("input"),pw=el("input"),nmI=el("input");
 em.type="email";em.placeholder="Email";em.autocomplete="email";pw.type="password";pw.placeholder="Password (6+ characters)";nmI.placeholder="Your name (for new accounts)";
 const b1=el("button","add","Sign in"),b2=el("button","add","Create account");b2.style.background="var(--bd)";b2.style.color="var(--tx)";
 b1.onclick=async()=>{msg("");const{error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error)msg(error.message)};
 b2.onclick=async()=>{msg("");if(!nmI.value.trim()){msg("Enter your name first.");return}
  const{data,error}=await sb.auth.signUp({email:em.value.trim(),password:pw.value,options:{data:{name:nmI.value.trim()}}});
  if(error)msg(error.message);else if(!data.session)msg("Account created. Confirm the email we sent, then sign in.");};
 [em,pw,nmI].forEach(i=>{const r=el("div","row");r.append(i);c.append(r)});
 const r=el("div","row");r.append(b1,b2);c.append(r);A.append(c);
}
function stats(k){const l=items.filter(i=>i.kid_id===k),s=c=>l.filter(i=>i.cat===c);
 const sg=a=>a.reduce((t,i)=>t+i.num*(i.sign==0?1:-1),0);
 return{bal:sg(s("money")),st:sg(s("stars")),spent:s("shop").filter(i=>i.done).reduce((t,i)=>t+i.num,0),temp:(s("health")[0]||{}).num}}
function draw(){
 if(busy)return;
 const A=$("app");A.textContent="";const r=role(),al=ALLOW[r];
 const top=el("div");top.append(document.createTextNode((prof?prof.name:"You")+" · "+(r==="admin"?"Admin":ROLES[r])+" · "));
 const so=el("button","link","Sign out");so.onclick=async()=>{prof=null;await sb.auth.signOut()};top.append(so);
 $("who").textContent="";$("who").append(top);
 if(!al.length){A.append(el("div","card","Your account is waiting for approval. Ask the admin to give you a role, then reload."));return}
 if(r==="child"&&prof.kid_id)kid=prof.kid_id;else if(!kids.find(k=>k.id===kid))kid=kids[0]&&kids[0].id;
 if(!al.includes(tab))tab=al[0];
 const n=el("nav");al.forEach(k=>{const b=el("button",k===tab?"on":"",TABS[k].n);b.onclick=()=>{tab=k;draw()};n.append(b)});A.append(n);
 if(r!=="child"&&kids.length>1&&tab!=="over"&&tab!=="people"){const s=el("select");kids.forEach(k=>{const o=el("option",null,k.name);o.value=k.id;s.append(o)});s.value=kid;s.style.width="100%";s.onchange=()=>{kid=s.value;draw()};A.append(s)}
 const S=el("div","card"),F=el("div","card"),L=el("div","card");
 if(tab==="over")overview(S);else if(tab==="people")people(S,F,L);else entries(S,F,L,r);
 [S,F,L].forEach(x=>{if(x.childNodes.length)A.append(x)});
}
function overview(S){
 kids.forEach(k=>{const t=stats(k.id),c=el("div","item"),l=el("div");
  l.append(el("b",null,k.name),el("div","sub","Balance ₹"+t.bal.toFixed(2)+" · Stars "+t.st+" · Spent ₹"+t.spent.toFixed(2)+" · Temp "+(t.temp?t.temp+"°F":"—")));c.append(l);S.append(c)});
}
async function act(p){busy=true;msg("Saving…");const{error}=await p;busy=false;if(error)msg(error.message);else{msg("");await load()}draw()}
function entries(S,F,L,r){
 const T=TABS[tab],list=items.filter(i=>i.cat===tab&&i.kid_id===kid),canAdd=["admin","parent","teacher"].includes(r);
 if(T.sign){const tot=list.reduce((t,i)=>t+i.num*(i.sign==0?1:-1),0);S.append(el("div","sub",tab==="money"?"Balance":"Total stars"),el("div","big",(tab==="money"?"₹":"")+tot.toFixed(tab==="money"?2:0)))}
 else if(tab==="shop")S.append(el("div","sub","Spent so far"),el("div","big","₹"+list.filter(i=>i.done).reduce((t,i)=>t+i.num,0).toFixed(2)));
 else if(tab==="health"){const l=list[0];S.append(el("div","sub","Last temperature"),el("div","big",l&&l.num?l.num+"°F":"—"))}
 else S.append(el("div","sub","Entries"),el("div","big",list.length));
 if(canAdd){
  const txt=el("input");txt.placeholder=T.txt;const r1=el("div","row");r1.append(txt);
  const r2=el("div","row");let num,sg;
  if(T.num){num=el("input");num.type="number";num.step="any";num.inputMode="decimal";num.placeholder=T.num;r2.append(num)}
  if(T.sign){sg=el("select");T.sign.forEach((o,i)=>{const op=el("option",null,o);op.value=i;sg.append(op)});r2.append(sg)}
  const dt=el("input");dt.type="date";dt.value=new Date().toISOString().slice(0,10);r2.append(dt);
  const ad=el("button","add","Add");
  ad.onclick=()=>{const v=num?parseFloat(num.value):0;if(!txt.value.trim()&&!(num&&!isNaN(v)))return;
   act(sb.from("entries").insert({kid_id:kid,cat:tab,text:txt.value.trim(),num:isNaN(v)?0:v,sign:sg?+sg.value:0,date:dt.value}))};
  r2.append(ad);F.append(r1,r2)}
 if(!list.length)L.append(el("div","sub","Nothing yet."));
 list.forEach(i=>{const it=el("div","item"),left=el("div"),t=el("div",null,i.text||"(no note)");
  if(tab==="shop"&&i.done)t.style.textDecoration="line-through";
  left.append(t,el("div","sub",(i.date||"")+(nm(i.by)?" · "+nm(i.by):"")));
  const right=el("div");right.style.cssText="display:flex;align-items:center;gap:4px";
  if(T.sign)right.append(el("b",i.sign==0?"pos":"neg",(i.sign==0?"+":"−")+(tab==="money"?"₹":"")+i.num));
  else if(tab==="shop"){right.append(el("span",null,"₹"+i.num));const c=el("input");c.type="checkbox";c.checked=!!i.done;c.disabled=!(r==="admin"||r==="parent");c.style.cssText="flex:none;width:22px;height:22px";c.onchange=()=>act(sb.from("entries").update({done:c.checked}).eq("id",i.id));right.append(c)}
  else if(tab==="health"&&i.num)right.append(el("b",i.num>=100.4?"fever":null,i.num+"°F"));
  if(r==="admin"){const x=el("button","x","✕");x.onclick=()=>{if(confirm("Delete this entry?"))act(sb.from("entries").delete().eq("id",i.id))};right.append(x)}
  it.append(left,right);L.append(it)});
}
function people(S,F,L){
 S.append(el("b",null,"Children"));
 kids.forEach(k=>S.append(el("div","item",k.name)));
 const ki=el("input");ki.placeholder="Add child name";const kb=el("button","add","Add");
 kb.onclick=()=>{const v=ki.value.trim();if(v)act(sb.from("kids").insert({name:v}))};
 const kr=el("div","row");kr.append(ki,kb);S.append(kr);
 F.append(el("b",null,"Accounts"),el("div","sub","New people create an account, then you give them a role here."));
 profs.filter(p=>p.id!==me.id).forEach(p=>{
  const box=el("div","item");box.style.display="block";box.append(el("div",null,p.name||"New user"));
  const row=el("div","row"),rs=el("select");Object.keys(ROLES).forEach(k=>{const o=el("option",null,ROLES[k]);o.value=k;rs.append(o)});rs.value=p.role==="admin"?"parent":p.role;
  const ks=el("select");kids.forEach(k=>{const o=el("option",null,k.name);o.value=k.id;ks.append(o)});ks.value=p.kid_id||(kids[0]&&kids[0].id)||"";
  const sh=()=>{ks.style.display=rs.value==="child"?"":"none"};sh();rs.onchange=sh;
  const sv=el("button","add","Save");sv.onclick=()=>act(sb.from("profiles").update({role:rs.value,kid_id:rs.value==="child"?ks.value:null}).eq("id",p.id));
  row.append(rs,ks,sv);box.append(row);F.append(box)});
}
init();
</script></body></html>
